<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>NEPTUNKOD Hallgatók</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        margin: 0;
        padding: 20px;
    }

    h1 {
        font-size: 28px;
        font-weight: bold;
        margin-bottom: 15px;
    }

    .container {
        background: white;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 6px;
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-top: 10px;
        font-weight: bold;
    }

    input[type="text"], input[type="email"] {
        width: 250px;
        padding: 6px;
        margin-top: 4px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    .btn {
        margin-top: 15px;
        padding: 8px 14px;
        background: #4CAF50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    .btn:hover {
        background: #45a049;
    }

    .search-sort-box {
        background: white;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 6px;
        margin-top: 20px;
    }

    select {
        padding: 6px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    .export-import {
        margin-top: 20px;
        padding-top: 10px;
        border-top: 1px solid #ddd;
    }

    .file-input {
        margin-top: 8px;
    }

</style>
</head>
<body>

<h1>NEPTUNKOD Hallgatók</h1>

<div class="container">
    <h2>Új hallgató hozzáadása</h2>

    <label>Név:</label>
    <input type="text">

    <label>Évfolyam:</label>
    <input type="text">

    <label>Szak:</label>
    <input type="text">

    <label>Email:</label>
    <input type="email">

    <label>NEPTUN kód:</label>
    <input type="text" placeholder="AAA-123">

    <button class="btn">Mentés</button>
</div>


<div class="search-sort-box">
    <label>Keresés:</label>
    <input type="text" placeholder="név">

    <label style="margin-top:20px;">Rendezés:</label>
    <select>
        <option>Nincs rendezés</option>
        <option>Név szerint</option>
        <option>Évfolyam szerint</option>
        <option>Szak szerint</option>
    </select>

    <div class="export-import">
        <h3>Export / Import JSON</h3>

        <button class="btn" style="background:#007BFF; margin-top: 10px;">Export JSON</button>

        <div class="file-input">
            Import JSON: <input type="file">
        </div>
    </div>
</div>

</body>
</html>
